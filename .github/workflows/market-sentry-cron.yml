name: Akshara 24/7 Market Sentry & Order Watcher

on:
  schedule:
    # Trigger audit every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sentry-audit:
    name: Audit Live Stock & Check Autonomous Orders
    runs-on: ubuntu-latest
    env:
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL || 'https://asksharagaming.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'akshara2026' }}
    steps:
      - name: Ping Market Sentry Cloud Endpoint
        run: |
          echo "Executing scheduled Market Sentry audit against ${VERCEL_APP_URL}..."
          curl -s -S --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "${VERCEL_APP_URL}/api/cron/sentry" || echo "Sentry check completed."

      - name: Ping Autonomous Order Polling Endpoint
        run: |
          echo "Executing scheduled Autonomous Order check against ${VERCEL_APP_URL}..."
          curl -s -S --max-time 30 -H "Authorization: Bearer ${CRON_SECRET}" "${VERCEL_APP_URL}/api/cron/check-orders" || echo "Order check completed."
