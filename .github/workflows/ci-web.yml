name: Web Typecheck, Build & Bot Syntax CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-web-and-bot:
    name: Verify Next.js Build & Python Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js production bundle
        working-directory: web
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-placeholder-key' }}
          VAULT_ENCRYPTION_SECRET: ${{ secrets.VAULT_ENCRYPTION_SECRET || 'ci-placeholder-vault-secret-32chars!' }}
        run: npm run build

      - name: Install claim-web dependencies
        working-directory: claim-web
        run: npm ci

      - name: Run claim-web TypeScript check
        working-directory: claim-web
        run: npx tsc --noEmit

      - name: Build claim-web production bundle
        working-directory: claim-web
        env:
          VAULT_ENCRYPTION_SECRET: ${{ secrets.VAULT_ENCRYPTION_SECRET || 'ci-placeholder-vault-secret-32chars!' }}
        run: npm run build

      - name: Setup Python & verify bot syntax
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax in bot/
        run: python -m py_compile bot/market_sentry.py bot/telegram_commander.py bot/eneba_data.py
